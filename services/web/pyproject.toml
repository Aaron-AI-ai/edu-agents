[project]
name = "edu-agents-web"
version = "0.1.0"
description = "Streamlit Web Service for edu-agents"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
